; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html

[env:scorpio]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = pico
framework = arduino
board_build.core = earlephilhower
board_build.filesystem_size = 1M
lib_ldf_mode = chain+
lib_deps =
	adafruit/Adafruit GC9A01A@^1.1.0
	adafruit/Adafruit GFX Library@^1.12.6
	adafruit/Adafruit NeoPXL8@^1.4.1
	adafruit/Adafruit BusIO@^1.17.4
	adafruit/Adafruit NeoPixel@^1.15.5
	adafruit/Adafruit EMC2101@^1.0.7
test_filter = embedded/*
build_flags = -I include
upload_port = /Volumes/RPI-RP2

[env:native]
platform = native
build_flags = -I include        ; Temp includes config.h + Palette.h from here
test_filter = test_temp, test_fancurve